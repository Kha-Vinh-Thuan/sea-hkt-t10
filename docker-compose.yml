services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hr
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    ports:
      - "5432:5432"
    volumes:
      # Same volume as the old Odoo setup: its database db-hr-sys stays here for reference.
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
